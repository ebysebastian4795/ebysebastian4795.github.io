<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eby Sebastian | Senior IT Systems Administrator</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#0b0f19;
  --card:#121826;
  --accent:#00f5c4;
  --accent2:#5b8cff;
  --text:#e6edf3;
  --muted:#8b949e;
  --border:rgba(255,255,255,0.06);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

#networkCanvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:80px 20px;
}

.hero{text-align:center;margin-bottom:60px}

.hero h1{
  font-size:48px;
  font-weight:800;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{margin-top:15px;color:var(--muted)}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:12px 28px;
  border-radius:10px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;
  text-decoration:none;
  font-weight:600;
  transition:0.3s;
}

.btn:hover{transform:translateY(-4px)}

.section{margin-bottom:60px}

.section h2{
  margin-bottom:25px;
  border-left:4px solid var(--accent);
  padding-left:12px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:25px;
  margin-bottom:20px;
}

.skill{margin-bottom:18px}

.skill-name{margin-bottom:6px;color:var(--muted)}

.skill-bar{
  height:8px;
  background:#1f2937;
  border-radius:6px;
  overflow:hidden;
}

.skill-progress{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:6px;
  transition:width 2s ease;
}

.footer{text-align:center;color:var(--muted);margin-top:40px}

@media(max-width:600px){
  .hero h1{font-size:32px}
}
</style>
</head>

<body>

<canvas id="networkCanvas"></canvas>

<div class="container">

<div class="hero">
  <h1>Eby Sebastian</h1>
  <p>Senior IT Systems Administrator | 7+ Years UAE Experience</p>
  <a href="EBY_SEBASTIAN_CV.pdf" download class="btn"><i class="fas fa-file-download"></i> Download CV</a>
</div>

<div class="section">
  <h2>Technical Expertise</h2>
  <div class="card">

    <div class="skill">
      <div class="skill-name">Microsoft 365 & Cloud</div>
      <div class="skill-bar"><div class="skill-progress" data-width="90%"></div></div>
    </div>

    <div class="skill">
      <div class="skill-name">Enterprise Networking</div>
      <div class="skill-bar"><div class="skill-progress" data-width="85%"></div></div>
    </div>

    <div class="skill">
      <div class="skill-name">Windows Server & AD</div>
      <div class="skill-bar"><div class="skill-progress" data-width="88%"></div></div>
    </div>

    <div class="skill">
      <div class="skill-name">IT Security & Surveillance</div>
      <div class="skill-bar"><div class="skill-progress" data-width="80%"></div></div>
    </div>

  </div>
</div>

<div class="footer">© 2026 Eby Sebastian | Premium Tech Portfolio</div>

</div>

<script>
// Animate skill bars
window.addEventListener('load',()=>{
  document.querySelectorAll('.skill-progress').forEach(bar=>{
    bar.style.width=bar.getAttribute('data-width')
  })
})

// Network Background Animation
const canvas=document.getElementById('networkCanvas')
const ctx=canvas.getContext('2d')
canvas.width=window.innerWidth
canvas.height=window.innerHeight

let particles=[]
const particleCount=80

for(let i=0;i<particleCount;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    vx:(Math.random()-.5)*0.6,
    vy:(Math.random()-.5)*0.6
  })
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height)
  ctx.fillStyle='rgba(0,245,196,0.7)'
  particles.forEach(p=>{
    ctx.beginPath()
    ctx.arc(p.x,p.y,2,0,Math.PI*2)
    ctx.fill()

    particles.forEach(p2=>{
      const dx=p.x-p2.x
      const dy=p.y-p2.y
      const dist=Math.sqrt(dx*dx+dy*dy)
      if(dist<120){
        ctx.strokeStyle='rgba(91,140,255,'+(1-dist/120)+')'
        ctx.lineWidth=0.5
        ctx.beginPath()
        ctx.moveTo(p.x,p.y)
        ctx.lineTo(p2.x,p2.y)
        ctx.stroke()
      }
    })

    p.x+=p.vx
    p.y+=p.vy

    if(p.x<0||p.x>canvas.width)p.vx*=-1
    if(p.y<0||p.y>canvas.height)p.vy*=-1
  })
  requestAnimationFrame(draw)
}

draw()

window.addEventListener('resize',()=>{
  canvas.width=window.innerWidth
  canvas.height=window.innerHeight
})
</script>

</body>
</html>
